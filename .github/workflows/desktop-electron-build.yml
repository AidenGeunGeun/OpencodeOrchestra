name: desktop-electron-build

# Build and upload Electron desktop artifacts on release tag.
# Runs alongside the Tauri desktop-build workflow until Tauri is retired.
#
# Code signing: not configured (no Apple Developer cert). macOS builds are
# ad-hoc signed only — users will see a Gatekeeper warning on first launch
# and need to right-click → Open. Linux builds are unaffected.
#
# Windows is intentionally not built. Tauri never built Windows either; the
# Bun cross-runtime download for Windows baseline is too unreliable on
# github-hosted runners. Add it back when there's actual Windows demand.

on:
  push:
    tags:
      - oco-v*
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            runner: macos-latest
            rust-target: aarch64-apple-darwin
            sidecar-build-args: ""
            platform-flag: --mac --arm64
          - name: Linux (x86_64)
            runner: ubuntu-22.04
            rust-target: x86_64-unknown-linux-gnu
            sidecar-build-args: --baseline
            platform-flag: --linux
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm

      - name: Build sidecar CLI
        working-directory: packages/opencode
        run: bun run script/build.ts --single --skip-install ${{ matrix.sidecar-build-args }}
        env:
          TAURI_ENV_TARGET_TRIPLE: ${{ matrix.rust-target }}
          RUST_TARGET: ${{ matrix.rust-target }}

      - name: Prebuild Electron (sidecar copy + node backend)
        working-directory: packages/desktop-electron
        run: bun run scripts/prebuild.ts
        env:
          OPENCODE_CHANNEL: prod
          RUST_TARGET: ${{ matrix.rust-target }}

      - name: Build Electron renderer + main
        working-directory: packages/desktop-electron
        run: bun run build
        env:
          OPENCODE_CHANNEL: prod

      - name: Validate package inputs
        working-directory: packages/desktop-electron
        run: bun run scripts/validate-package.ts

      - name: Package Electron app
        working-directory: packages/desktop-electron
        run: bunx electron-builder ${{ matrix.platform-flag }} --publish never --config electron-builder.config.ts
        env:
          OPENCODE_CHANNEL: prod
          # Skip the packaged smoke in CI — it requires GUI subsystems and an
          # interactive run loop. Local dogfood + the validate step cover the
          # build-input invariants.
          OCO_ELECTRON_SKIP_PACKAGED_SMOKE: "1"
          # Ad-hoc signing only (no Apple Developer cert).
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/oco-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/desktop-electron/dist/oco-electron-*.dmg
            packages/desktop-electron/dist/oco-electron-*.zip
            packages/desktop-electron/dist/oco-electron-*.AppImage
            packages/desktop-electron/dist/oco-electron-*.deb
            packages/desktop-electron/dist/oco-electron-*.rpm
          tag_name: ${{ github.ref_name }}
          generate_release_notes: false
          append_body: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: oco-electron-${{ matrix.rust-target }}
          path: |
            packages/desktop-electron/dist/oco-electron-*.dmg
            packages/desktop-electron/dist/oco-electron-*.zip
            packages/desktop-electron/dist/oco-electron-*.AppImage
            packages/desktop-electron/dist/oco-electron-*.deb
            packages/desktop-electron/dist/oco-electron-*.rpm
